{% extends "base.html" %}
{% block title %}Checkout - ShopSphere{% endblock %}
{% block content %}
<section class="checkout">
    <div>
        <h1>Checkout</h1>
        <form method="POST" class="form">
            <label>Full Name</label><input name="name" required>
            <label>Email</label><input type="email" name="email" required>
            <label>Delivery Address</label><textarea name="address" rows="5" required></textarea>
            <button class="btn" type="submit">Place Order</button>
        </form>
    </div>
    <aside class="summary">
        <h2>Order Summary</h2>
        {% for item in items %}
        <p>{{ item.product.name }} × {{ item.qty }} <b>₹{{ "%.2f"|format(item.subtotal) }}</b></p>
        {% endfor %}
        <hr><h2>Total ₹{{ "%.2f"|format(total) }}</h2>
    </aside>
</section>
{% endblock %}
